name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Callable, so the wiki sync can deploy what it just committed — a push made
  # with GITHUB_TOKEN never triggers a workflow of its own.
  workflow_call:
  # `src/blog/publish-blog.ts` has fired this at the repository since the blog
  # editor shipped, and nothing listened: the handler was never written. It was
  # harmless only by luck — the contents-API commit that precedes it is made
  # with a PAT, so it triggers the `push` above on its own — but the editor
  # tells the writer "asking the site to rebuild…" and then, on failure,
  # "the deploy will run on its next scheduled pass", and there is no scheduled
  # pass. Listening makes both sentences true.
  repository_dispatch:
    types: [deploy]

# Required by actions/deploy-pages: read the repo, write a Pages deployment,
# and mint the OIDC token it verifies the deployment with.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The `secrets` context is not available to a step's `if:`, so the
    # passphrase comes in as job-level env and the step tests that instead.
    env:
      HOME_PASSPHRASE: ${{ secrets.HOME_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The question file written by the site is parsed by two programs that do
      # not import it — `bin/wiki-work` and `sageEntries()` in sync-wiki.mjs —
      # and neither fails loudly when it stops recognising one. A question they
      # cannot see is a question nobody is told to answer, so the contract is
      # checked here rather than trusted.
      - name: Check the sage question-file contract
        run: npm run sage:check

      # Same reasoning for the intake ledger: its event log is parsed by
      # `bin/wiki-intake` in wiki-brain, which shares no code with the writer.
      # These assertions are the refusals — that a remainder is never reported
      # as exact while an unquantified event stands against the unit, and that
      # a mean dose is never the initial quantity over the event count.
      - name: Check the intake ledger's arithmetic
        run: npm run ledger:check

      # And the slate board, which is the only dataset here written by a form
      # in a browser rather than by a script in this job. Every way it can be
      # wrong — a plate id nobody has, a filename with no file behind it, a
      # wall no component reads — renders as the fallback, which is to say as
      # a working site with the wrong pictures on it.
      - name: Check the slate board
        run: npm run slates:check

      # Which vault the door will be checked against, said out loud on every
      # run.
      #
      # The comment that stood here claimed that without the secret "the site
      # deploys with the door unconfigured". That is not what happens and never
      # was: `public/gate/verify.enc` is committed, and on this deployment it is
      # the source of truth — HOME_PASSPHRASE is unset, the rebuild is skipped,
      # and the committed vault is what the gate decrypts against. A supported
      # arrangement, but a skipped step reads exactly like a broken one, and a
      # wrong sentence in a workflow nobody has reason to doubt survives for
      # months. So the run now states which of the two vaults it shipped.
      #
      # ---- before ever setting HOME_PASSPHRASE, read this ------------------
      #
      # Turning that secret on is a change to this file, not a change in the
      # settings page, because of two traps that both fail silently:
      #
      #   1. This job passes HOME_PASSPHRASE and never HOME_COMBINATION, and
      #      `scripts/phrases.mjs` builds one blob per input it is given. The
      #      rebuild would therefore write a one-way vault and the KEYPAD and
      #      the DIAL would stop opening the door.
      #   2. Nothing here runs `npm run keyring`. `scripts/make-verify.mjs` is
      #      explicit that the two are rebuilt from the same inputs or not at
      #      all: the gate stores whichever phrase opened it, and `keyring.enc`
      #      is opened with that phrase. When they drifted apart on 2026-08-27
      #      the door opened and every SAVE silently stopped committing.
      - name: Build the gate verifier
        if: env.HOME_PASSPHRASE != ''
        run: |
          npm run gate:verify
          echo '::notice::gate: verify.enc rebuilt from HOME_PASSPHRASE for this deploy.'

      # The other half, and the one that had nothing to say for itself.
      - name: Say which verifier is shipping
        if: env.HOME_PASSPHRASE == ''
        run: |
          set -euo pipefail
          if [ ! -f public/gate/verify.enc ]; then
            echo '::error::No verifier: HOME_PASSPHRASE is unset AND public/gate/verify.enc is not committed.'
            echo 'The gate would find nothing to check against, offer ENTER ANYWAY to every'
            echo 'visitor, and the deploy would stay green while doing it. Refusing to ship that.'
            exit 1
          fi
          echo '::notice::gate: HOME_PASSPHRASE is unset — shipping the committed public/gate/verify.enc.'
          echo 'That is the supported arrangement here, not a failure.'
          echo 'To change the door, rebuild BOTH artifacts from the same inputs and commit them:'
          echo '  HOME_COMBINATION=.. HOME_PASSPHRASE=.. npm run gate:verify'
          echo '  HOME_COMBINATION=.. HOME_PASSPHRASE=.. GITHUB_TOKEN=.. npm run keyring'

      # Project sites are served from /<repo>/, not the domain root. Taken
      # from GITHUB_REPOSITORY rather than github.event.repository, which is
      # not populated on a schedule or a reusable call.
      - run: echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - run: npm run build

      # enablement turns Pages on (source: GitHub Actions) if it is not already,
      # so the first deploy needs no manual visit to repo settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
