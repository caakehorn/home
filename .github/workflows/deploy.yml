name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Callable, so the wiki sync can deploy what it just committed — a push made
  # with GITHUB_TOKEN never triggers a workflow of its own.
  workflow_call:

# Required by actions/deploy-pages: read the repo, write a Pages deployment,
# and mint the OIDC token it verifies the deployment with.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The `secrets` context is not available to a step's `if:`, so the
    # passphrase comes in as job-level env and the step tests that instead.
    env:
      HOME_PASSPHRASE: ${{ secrets.HOME_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The question file written by the site is parsed by two programs that do
      # not import it — `bin/wiki-work` and `sageEntries()` in sync-wiki.mjs —
      # and neither fails loudly when it stops recognising one. A question they
      # cannot see is a question nobody is told to answer, so the contract is
      # checked here rather than trusted.
      - name: Check the sage question-file contract
        run: npm run sage:check

      # Same reasoning for the intake ledger: its event log is parsed by
      # `bin/wiki-intake` in wiki-brain, which shares no code with the writer.
      # These assertions are the refusals — that a remainder is never reported
      # as exact while an unquantified event stands against the unit, and that
      # a mean dose is never the initial quantity over the event count.
      - name: Check the intake ledger's arithmetic
        run: npm run ledger:check

      # The gate's verifier, written from the repository secret so the
      # passphrase never enters the repository. Without the secret the site
      # deploys with the door unconfigured, which the gate says out loud
      # rather than pretending to be locked.
      - name: Build the gate verifier
        if: env.HOME_PASSPHRASE != ''
        run: npm run gate:verify

      # Project sites are served from /<repo>/, not the domain root. Taken
      # from GITHUB_REPOSITORY rather than github.event.repository, which is
      # not populated on a schedule or a reusable call.
      - run: echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - run: npm run build

      # enablement turns Pages on (source: GitHub Actions) if it is not already,
      # so the first deploy needs no manual visit to repo settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
