name: Sync the wiki snapshot

# The portal serves a vendored snapshot of caakehorn/wiki-brain. This is what
# closes the loop: the editor commits a page to that repository and fires
# `wiki-updated` at this one, which re-derives the snapshot and redeploys, so
# the edit is live for everyone rather than only in the browser that made it.
on:
  # The fast path, and it is still the fast path: the portal's own client fires
  # this the moment somebody edits a page, asks a question or catches a word —
  # `requestResync` in src/wiki/publish.ts, called from there and from
  # src/sage/ask.ts and src/lexicon/submit.ts. Those reach the site in seconds
  # and always have. Do not remove this trigger to simplify the schedule below.
  repository_dispatch:
    types: [wiki-updated]
  workflow_dispatch:

  # The other half, and since 2026-08-31 the primary one.
  #
  # An edit merged as a pull request in wiki-brain has no browser behind it, so
  # nothing fires the dispatch above. That was meant to be covered by
  # `notify-portal.yml` there, which needs a cross-repository token; the token
  # went missing on 2026-08-28 and the workflow reported success while sending
  # nothing for three days. Every agent-written page waited for this schedule,
  # which was `17 * * * *` — up to a full hour, on the half of the corpus that
  # moves most.
  #
  # So the schedule is the mechanism now rather than the safety net, and it is
  # set to the shortest interval GitHub offers. Five minutes is a floor, not a
  # promise: scheduled runs are delayed under load, so expect 5–15 in practice.
  #
  # This is affordable because a run that finds nothing costs only runner time,
  # which is free on a public repository. The churn guard below restores the
  # snapshot when only `generatedAt` moved, `git diff --cached --quiet` then
  # exits before committing, and the deploy job is gated on `deploy == 'true'`
  # — so 288 runs a day produce exactly as many deploys as 24 did, plus a retry
  # on any run that finds the site behind main (see the `published` step). At ~75s a run
  # against a 300s interval, and with `concurrency` serialising them (a new
  # dispatch cancelling an in-flight one), they cannot pile up either.
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

# One sync at a time, last dispatch wins. Two saves a minute apart used to
# queue (`cancel-in-progress: false`); the second run then checked out the SHA
# captured when its dispatch fired — still the main from before the first run
# pushed — and died rebasing two snapshots of `public/wiki` onto each other.
# That was 2026-08-31 around 17:33 ET.
#
# A new `wiki-updated` cancels whatever is in flight. The cancelled run's
# derivation is discarded; the new one re-derives from current wiki-brain,
# which already holds every save that dispatched. A scheduled run does not
# cancel: cancelling a dispatch that has already pushed but not yet deployed
# would leave the snapshot on main and never call Pages.
concurrency:
  group: sync-wiki
  cancel-in-progress: ${{ github.event_name == 'repository_dispatch' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      # Whether anything needs publishing. NOT the same question as whether
      # main moved — see the `published` step for why that distinction is the
      # whole point of it.
      deploy: ${{ steps.decide.outputs.deploy }}
      # The commit the deploy builds: either the snapshot this run pushed or,
      # when an earlier deploy failed, whatever main holds now. Never the SHA
      # that fired the run, which is an ancestor with no snapshot in it.
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      # fetch-depth: 0 because the page-history derivation reads the log, and a
      # shallow clone's log does not reach the first version of any page — it
      # would render as "created on the day the clone was cut," which is a
      # confident wrong claim about when the writing happened.
      # build-wiki-history.mjs refuses to run against a shallow checkout rather
      # than publish that, so removing this line takes the feature down loudly.
      # The whole repository is ~270 MB packed; the clone costs well under a
      # minute against the hour this job already runs on.
      - name: Check out the wiki source
        uses: actions/checkout@v4
        with:
          repository: caakehorn/wiki-brain
          path: .wiki-brain
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # One implementation of the derivation, the same one a local sync runs.
      #
      # WIKI_LOCK_PASSPHRASE is what re-seals the pages named in
      # wiki.locks.json. Without it a sync that has pages to seal stops instead
      # of committing them in the clear — so if this step starts failing after
      # a page was sealed, the missing repository secret is why, and adding it
      # is the fix rather than removing the lock.
      - run: node scripts/sync-wiki.mjs .wiki-brain
        env:
          WIKI_LOCK_PASSPHRASE: ${{ secrets.WIKI_LOCK_PASSPHRASE }}

      # Page history, from the log of the checkout above. Must come after the
      # sync: it reads the index that sync just wrote to know which pages exist
      # and which of them are sealed, and it writes `updated` and `revisions`
      # back into that same index. It exits 1 rather than publish a history it
      # could not reproduce from git exactly.
      - run: node scripts/build-wiki-history.mjs .wiki-brain

      # The same claim, proved a second way before it is committed: the SHIPPED
      # files, folded through the applier the browser runs (a separate copy from
      # the build's), against the blobs git holds. The build proving itself
      # against itself would pass even if both halves were wrong in the same
      # direction — this is the run that has the source repository to check
      # against, so it is the run that does the whole check.
      - run: npm run history:check -- .wiki-brain

      # sync-wiki embeds the current wall-clock time in the datasets it writes.
      # Those files are one-line JSON, so a normal diff sees the whole file as
      # changed every hour even when the source wiki did not move. Detect that
      # exact timestamp-only case before staging; real content changes still
      # proceed normally and get the new generatedAt value.
      #
      # This used to name the three files it knew about. `lexicon.json` shipped
      # after it was written, was never added, and quietly defeated the whole
      # step: one un-listed file in the changed set failed the `every` test, so
      # every hourly run committed a no-op diff and called a full Pages deploy
      # behind it. A guard against churn that is itself a hand-maintained list
      # of the things that churn is a guard with an expiry date on it — so the
      # test is now the property rather than the filenames. Any changed file
      # whose only difference is its `generatedAt` is churn, whatever it is
      # called; page JSONs carry no such field, so a real edit can never
      # normalise away, and a new or deleted page moves index.json's content
      # too.
      - name: Ignore timestamp-only wiki churn
        run: |
          node <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'

          const changed = execFileSync('git', ['diff', '--name-only', '--', 'public/wiki'], { encoding: 'utf8' })
            .trim()
            .split('\n')
            .filter(Boolean)

          if (!changed.length) process.exit(0)

          const normalize = (text) => text.replace(/"generatedAt":"[^"]*"/g, '"generatedAt":"<normalized>"')
          for (const path of changed) {
            let current
            let previous
            try {
              current = normalize(readFileSync(path, 'utf8'))
              previous = normalize(execFileSync('git', ['show', `HEAD:${path}`], { encoding: 'utf8' }))
            } catch {
              process.exit(0) // added, deleted, or unreadable — a real change
            }
            if (current !== previous) process.exit(0)
          }

          console.log(`Only generatedAt moved in ${changed.length} file(s); restoring the existing snapshot.`)
          execFileSync('git', ['restore', '--source=HEAD', '--', 'public/wiki'], { stdio: 'inherit' })
          NODE

      - run: npm run leviathan

      # THE CORTEX's wiki instruments and THE CORE's structure read the same
      # snapshot. They were absent here until 2026-08-29, which is why
      # public/leviathan/wiki.json sat 33 pages behind the snapshot for eight
      # days: nothing rebuilt it but a hand-run, and a wiki change that removed
      # pages left it naming pages the site no longer had. Both must come after
      # `npm run leviathan`, since build-core reads its chronology.json.
      #
      # Both were also changed to take generatedAt from the snapshot rather
      # than the clock before being added here — as wall-clock builds they
      # would have committed a diff and fired a deploy on every hourly run.
      - run: npm run wiki-instruments
      - run: npm run core

      # THE DOCKET reads the same snapshot. Its own generatedAt is the
      # snapshot's rather than the wall clock's, so it churns only when the
      # wiki does — see the note in scripts/build-docket.mjs.
      - run: npm run docket

      # The derivation is all-or-nothing on purpose: every step above runs before
      # anything is staged, so a build that fails leaves the whole snapshot at
      # its previous state rather than committing a half-updated one where
      # public/wiki has moved and public/core has not.
      - id: commit
        name: Commit the snapshot if it moved
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/wiki public/leviathan public/docket public/core
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Snapshot already current.'
            exit 0
          fi
          git commit -m 'Resync the wiki snapshot'

          # A merge landing on main during the ~60s this job takes rejects the
          # push as non-fast-forward. Two wiki-updated runs can also both commit
          # on the same parent: repository_dispatch checks out the SHA captured
          # at fire time, so a second save serialised behind the first still
          # starts from the old main and then dies rebasing two snapshots of
          # public/wiki onto each other (2026-08-31, 17:33 ET).
          #
          # Last-dispatch-wins: on a rejected push, take origin/main and plant
          # THIS run's derived snapshot on top of it. Replaying hunks is the
          # thing that conflicts; the files themselves are a complete snapshot
          # and replacing them is the point of the job. The later dispatch
          # derived from current wiki-brain, so it is the one that should land.
          OURS=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            if git push; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              # The deploy builds this SHA rather than the one that fired the
              # run, which is an ancestor of it and has no snapshot in it.
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::push rejected (attempt $attempt) — main moved; planting this snapshot on it"
            git fetch origin main
            git reset --hard origin/main
            git rm -r --quiet --ignore-unmatch public/wiki public/leviathan public/docket public/core
            git checkout "$OURS" -- public/wiki public/leviathan public/docket public/core
            git add public/wiki public/leviathan public/docket public/core
            if git diff --cached --quiet; then
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              echo 'Snapshot already current on origin/main.'
              exit 0
            fi
            git commit -m 'Resync the wiki snapshot'
          done
          echo '::error::could not push the resynced snapshot after three attempts'
          exit 1

      # ---- is the SITE current? a different question from "did main move" ---
      #
      # `changed` answers whether main moved. It does not answer whether that
      # reached anybody, and the deploy was gated on `changed` alone. So a
      # deploy that failed left main holding a snapshot the site did not have;
      # every later sync re-derived that same snapshot, found it already
      # current, reported changed=false and skipped the deploy — and the
      # failure became permanent, silent, and invisible to every green run.
      #
      # Not hypothetical. `npm run tool:check` began failing on 2026-09-03 at
      # 02:16 UTC and the site served the 00:48 snapshot for three days while
      # every scheduled sync here reported success. main stood at 498 pages and
      # 972,352 words; the published index.json at 496 and 894,408. The SYNC
      # BEHIND banner was the only thing that noticed, and it named this
      # workflow as the thing that closes the gap while this workflow was
      # skipping the only step that could close it.
      #
      # So the published snapshot is asked directly, and compared against
      # origin/main rather than the checkout, which may be behind it. A
      # repository state and a deployment state are two different facts, and
      # only one of them is what a reader sees. "Nothing changed" must never
      # again mean "nothing needs deploying".
      #
      # The failure mode in the other direction is a deploy that re-fails on
      # every scheduled run until somebody fixes it. That is the intended
      # trade: on a public repository runner time is free, and loud and stale
      # beats silent and stale.
      - id: published
        name: Is the live site serving what is on main?
        if: steps.commit.outputs.changed != 'true'
        run: |
          set -uo pipefail
          git fetch --quiet origin main
          SITE="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/wiki/index.json"
          generated_at() { node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).generatedAt' 2>/dev/null; }

          ON_MAIN="$(git show origin/main:public/wiki/index.json | generated_at || true)"
          ON_SITE="$(curl -fsS --max-time 30 "$SITE" | generated_at || true)"

          echo "  on main   ${ON_MAIN:-<unreadable>}"
          echo "  on site   ${ON_SITE:-<unreachable>}"

          # Unreachable is not stale: a network blip must not queue a deploy on
          # every run, and `changed` still publishes real movement either way.
          #
          # But a comparison that can never be made is a recovery that never
          # happens, which is the failure this step exists to end — so the two
          # halves are reported separately. An unreadable blob means the shallow
          # checkout did not fetch it and this step needs fixing; an unreachable
          # site is the network, or Pages being down.
          if [ -z "$ON_MAIN" ]; then
            echo '::warning::could not read public/wiki/index.json at origin/main — this step cannot detect a stale site'
            echo 'stale=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$ON_SITE" ]; then
            echo "::warning::could not reach $SITE — not forcing a deploy this run"
            echo 'stale=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ON_MAIN" = "$ON_SITE" ]; then
            echo 'stale=false' >> "$GITHUB_OUTPUT"
            echo 'The site is serving the snapshot on main.'
            exit 0
          fi
          echo "::notice::main holds a snapshot the site never got ($ON_MAIN vs $ON_SITE) — deploying it"
          echo 'stale=true' >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      # One answer, so the deploy's `if:` and its `ref` cannot disagree about
      # whether to ship or about which commit is being shipped.
      - id: decide
        name: Deploy, and what
        run: |
          set -euo pipefail
          if [ '${{ steps.commit.outputs.changed }}' = 'true' ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            echo 'sha=${{ steps.commit.outputs.sha }}' >> "$GITHUB_OUTPUT"
            echo 'Deploying the snapshot this run pushed.'
          elif [ '${{ steps.published.outputs.stale }}' = 'true' ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            echo 'sha=${{ steps.published.outputs.sha }}' >> "$GITHUB_OUTPUT"
            echo 'Nothing to derive, but the site is behind main. Deploying main.'
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Snapshot current, and the site has it. Nothing to do.'
          fi

  # A push made with GITHUB_TOKEN does not trigger other workflows, so the
  # deploy is called rather than waited for.
  deploy:
    needs: sync
    if: needs.sync.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
